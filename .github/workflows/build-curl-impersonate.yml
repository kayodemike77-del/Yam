name: Build curl-impersonate for Windows

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-firefox-msys2:
    name: Build Firefox variant via MSYS2
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-go
            mingw-w64-x86_64-nss
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            make
            autoconf
            automake
            libtool
            pkg-config
            perl
            git
            patch
            unzip
            wget

      - name: Install gyp-next
        shell: msys2 {0}
        run: |
          pip install gyp-next

      - name: Clone curl-impersonate
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/lwthiker/curl-impersonate.git
          cd curl-impersonate
          ls -la

      - name: Configure and Build Firefox variant
        shell: msys2 {0}
        run: |
          cd curl-impersonate
          mkdir -p build
          cd build
          ../configure --prefix=/mingw64
          make firefox-build

      - name: Collect Firefox artifacts
        shell: msys2 {0}
        run: |
          mkdir -p /tmp/artifacts
          cd curl-impersonate/build
          # Copy built curl executables
          find . -name "curl-impersonate-*" -type f -exec cp {} /tmp/artifacts/ \; || true
          find . -name "curl_ff*" -type f -exec cp {} /tmp/artifacts/ \; || true
          # Also check in install location
          find /mingw64/bin -name "curl-impersonate-*" -type f -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          find /mingw64/bin -name "curl_ff*" -type f -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          ls -lah /tmp/artifacts/
          
      - name: Upload Firefox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curl-impersonate-firefox-windows
          path: D:\a\_temp\msys64\tmp\artifacts\
          if-no-files-found: error

  build-chrome-msys2:
    name: Build Chrome variant via MSYS2
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-go
            mingw-w64-x86_64-nasm
            make
            autoconf
            automake
            libtool
            pkg-config
            perl
            git
            patch
            unzip
            wget

      - name: Clone curl-impersonate
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/lwthiker/curl-impersonate.git
          cd curl-impersonate
          ls -la

      - name: Configure and Build Chrome variant
        shell: msys2 {0}
        run: |
          cd curl-impersonate
          mkdir -p build
          cd build
          ../configure --prefix=/mingw64
          make chrome-build

      - name: Collect Chrome artifacts
        shell: msys2 {0}
        run: |
          mkdir -p /tmp/artifacts
          cd curl-impersonate/build
          # Copy built curl executables
          find . -name "curl-impersonate-*" -type f -exec cp {} /tmp/artifacts/ \; || true
          find . -name "curl_chrome*" -type f -exec cp {} /tmp/artifacts/ \; || true
          find . -name "curl_edge*" -type f -exec cp {} /tmp/artifacts/ \; || true
          find . -name "curl_safari*" -type f -exec cp {} /tmp/artifacts/ \; || true
          # Also check in install location
          find /mingw64/bin -name "curl-impersonate-*" -type f -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          find /mingw64/bin -name "curl_chrome*" -type f -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          find /mingw64/bin -name "curl_edge*" -type f -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          find /mingw64/bin -name "curl_safari*" -type f -exec cp {} /tmp/artifacts/ \; 2>/dev/null || true
          ls -lah /tmp/artifacts/
          
      - name: Upload Chrome artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curl-impersonate-chrome-windows
          path: D:\a\_temp\msys64\tmp\artifacts\
          if-no-files-found: error

